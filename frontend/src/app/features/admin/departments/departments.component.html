<div class="cp-admin-page">
  <div class="cp-admin-header">
    <h1>Departments</h1>
    <nav class="cp-admin-nav">
      <a routerLink="/admin" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="active">Overview</a>
      <a routerLink="/admin/issues" routerLinkActive="active">Issues</a>
      <a routerLink="/admin/departments" routerLinkActive="active">Departments</a>
      <a routerLink="/admin/categories" routerLinkActive="active">Categories</a>
    </nav>
  </div>

  <form class="cp-toolbar cp-card" [formGroup]="form" (ngSubmit)="add()">
    <mat-form-field appearance="outline" class="cp-filter-field">
      <mat-label>New department name</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="cp-filter-field">
      <mat-label>Contact email</mat-label>
      <input matInput formControlName="contact_email" />
    </mat-form-field>
    <button mat-flat-button color="primary" type="submit">
      <mat-icon>add</mat-icon>
      Add
    </button>
  </form>

  <div class="cp-table-wrap cp-card">
    <ul class="cp-list">
      @for (d of departments; track d.id) {
        <li>
          <div>
            <strong>{{ d.name }}</strong>
            <span class="cp-muted"> · {{ d.contact_email || 'no contact email' }}</span>
          </div>
          <button mat-icon-button (click)="remove(d.id)" aria-label="Delete department">
            <mat-icon>delete</mat-icon>
          </button>
        </li>
      }
    </ul>
  </div>
</div>
