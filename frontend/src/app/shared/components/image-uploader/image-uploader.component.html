<div
  class="cp-dropzone"
  [class.drag-over]="isDragOver"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave()"
  (drop)="onDrop($event)"
>
  @if (previews.length === 0) {
    <mat-icon>add_a_photo</mat-icon>
    <p>Drag &amp; drop photos here, or</p>
  }
  <label class="cp-file-label">
    <input type="file" accept="image/*" multiple hidden (change)="onFileInput($event)" />
    <button type="button" mat-stroked-button>Choose Photos</button>
  </label>
  <p class="cp-hint cp-muted">Up to {{ maxFiles }} photos, JPG/PNG</p>
</div>

@if (previews.length > 0) {
  <div class="cp-previews">
    @for (p of previews; track p.url; let i = $index) {
      <div class="cp-preview">
        <img [src]="p.url" alt="Preview" />
        <button mat-icon-button class="cp-remove" (click)="removeFile(i)" aria-label="Remove photo">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    }
  </div>
}
